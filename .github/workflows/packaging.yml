name: Packaging

on:
  push:
    branches: [ master ]
  pull_request:
    branches: '*'

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1

defaults:
  run:
    shell: bash -l {0}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extension: logout
            name: logout
          - extension: theme-toggler
            name: theme_toggler
          - extension: topbar-text
            name: topbar_text
          - extension: stop-server
            name: topbar_stop_server

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    - name: Package the extension
      working-directory: packages/${{ matrix.extension }}-extension
      run: |
        set -eux
        pip install build
        python -m build
        pip uninstall -y "jupyterlab_${{ matrix.name }}" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.extension }}-extension-artifacts
        path: packages/${{ matrix.extension }}-extension/dist/jupyterlab_${{ matrix.name }}*
        if-no-files-found: error

  install:
    runs-on: ${{ matrix.os }}-latest
    needs: [build]
    strategy:
      fail-fast: false
      # Every extension is its own matrix dimension. (Listing extensions only
      # under `include` doesn't work: each later include entry overwrites the
      # `extension` added by the previous one, so only the last was tested.)
      matrix:
        os: [ubuntu, macos, windows]
        python: ['3.10', '3.13']
        extension: [logout, theme-toggler, topbar-text, stop-server]
        include:
          # Oldest tested Python installs the sdist, newest installs the wheel
          - python: '3.10'
            dist_ext: tar.gz
          - python: '3.13'
            dist_ext: whl
          # Python package name and lab extension name of each extension
          - extension: logout
            name: logout
            labext: jupyterlab-logout
          - extension: theme-toggler
            name: theme_toggler
            labext: jupyterlab-theme-toggler
          - extension: topbar-text
            name: topbar_text
            labext: jupyterlab-topbar-text
          - extension: stop-server
            name: topbar_stop_server
            labext: jupyterlab-topbar-stop-server
          - os: windows
            py_cmd: python
          - os: macos
            py_cmd: python3
          - os: ubuntu
            py_cmd: python
        # actions/setup-python do not support MacOS runners based on ARM for Python < 3.13
        # https://github.com/actions/setup-python/issues/906
        exclude:
          - os: macos
            python: '3.10'

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: 'x64'

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.extension }}-extension-artifacts
          path: packages/${{ matrix.extension }}-extension/dist

      # Seems like we need to create a virtual env for MacOS runners as they are 
      # based on ARM now. To avoid conditional logic, we create vritual envs for all
      # OS types
      - name: Create venv
        run: |
          ${{ matrix.py_cmd }} -m venv venv

      - name: Install prerequisites
        run: |
          source ./venv/bin/activate
          ${{ matrix.py_cmd }} -m pip install pip wheel

      - name: Install package
        run: |
          source ./venv/bin/activate
          cd packages/${{ matrix.extension }}-extension/dist
          ${{ matrix.py_cmd }} -m pip install -vv jupyterlab_${{ matrix.name }}*.${{ matrix.dist_ext }}

      - name: Validate environment
        run: |
          source ./venv/bin/activate
          ${{ matrix.py_cmd }} -m pip freeze
          ${{ matrix.py_cmd }} -m pip check

      - name: Validate install
        run: |
          source ./venv/bin/activate
          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "${{ matrix.labext }}.*OK"

      - name: Validate server extension
        if: matrix.extension == 'stop-server'
        run: |
          source ./venv/bin/activate
          jupyter server extension list
          jupyter server extension list 2>&1 | grep -ie "jupyterlab_topbar_stop_server.*OK"
